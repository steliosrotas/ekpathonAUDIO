<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Live Audio Stream</title>
  <style>
    :root { --bg: #0f172a; --card: #1e293b; --text: #f8fafc; --muted: #94a3b8; --accent: #38bdf8; --live: #22c55e; }
    * { box-sizing: border-box; font-family: system-ui, -apple-system, sans-serif; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: var(--bg); color: var(--text); padding: 16px; }
    .card { width: 100%; max-width: 440px; background: var(--card); border-radius: 16px; padding: 28px; box-shadow: 0 16px 40px rgba(0,0,0,.4); text-align: center; }
    .badge { display: inline-flex; align-items: center; gap: 8px; padding: 6px 14px; border-radius: 999px; font-size: 13px; font-weight: 600; background: rgba(148,163,184,.15); color: var(--muted); }
    .badge.live { background: rgba(34,197,94,.18); color: #86efac; }
    .dot { width: 8px; height: 8px; border-radius: 50%; background: currentColor; }
    h1 { margin: 18px 0 8px; font-size: 22px; word-break: break-word; }
    p { margin: 0 0 24px; color: var(--muted); font-size: 14px; }
    button { width: 100%; padding: 14px; border: 0; border-radius: 10px; font-size: 16px; font-weight: 600; cursor: pointer; background: var(--accent); color: #0f172a; }
    button.playing { background: #ef4444; color: #fff; }
    .vol { margin-top: 18px; display: flex; align-items: center; gap: 12px; color: var(--muted); font-size: 14px; }
    .vol input { flex: 1; accent-color: var(--accent); }
    .footer { margin-top: 22px; font-size: 12px; color: var(--muted); }
    .footer a { color: var(--accent); text-decoration: none; }
  </style>
</head>
<body>
  <div class="card">
    <div id="badge" class="badge"><span class="dot"></span><span id="badgeText">Connecting...</span></div>
    <h1 id="title">Audio Relay</h1>
    <p id="statusMsg">Press Listen to connect. Outputs silence when no stream is active.</p>

    <button id="toggleBtn">Listen</button>

    <div class="vol">
      <span>Volume</span>
      <input id="volume" type="range" min="0" max="1" step="0.01" value="0.85" />
    </div>

    <audio id="player" preload="none" crossorigin="anonymous"></audio>
    <div class="footer"><a href="admin.html">Admin Panel</a></div>
  </div>

  <script src="config.js"></script>
  <script>
    const params = new URLSearchParams(location.search);
    const serverUrl = (params.get("server") || window.DEFAULT_RELAY_URL || "").replace(/\/+$/, "");

    const player = document.getElementById("player");
    const toggleBtn = document.getElementById("toggleBtn");
    const volumeEl = document.getElementById("volume");
    const badge = document.getElementById("badge");
    const badgeText = document.getElementById("badgeText");
    const titleEl = document.getElementById("title");
    const statusMsg = document.getElementById("statusMsg");

    let listening = false;
    player.volume = parseFloat(volumeEl.value);

    volumeEl.addEventListener("input", () => {
      player.volume = parseFloat(volumeEl.value);
    });

    function startAudio() {
      player.src = `${serverUrl}/audio?t=${Date.now()}`;
      player.play().catch((err) => {
        statusMsg.textContent = "Playback error: " + err.message;
      });
    }

    toggleBtn.addEventListener("click", () => {
      if (!listening) {
        listening = true;
        toggleBtn.textContent = "Disconnect";
        toggleBtn.classList.add("playing");
        startAudio();
      } else {
        listening = false;
        player.pause();
        player.removeAttribute("src");
        player.load();
        toggleBtn.textContent = "Listen";
        toggleBtn.classList.remove("playing");
      }
    });

    // Auto-reconnect if the continuous audio stream ever drops
    player.addEventListener("error", () => {
      if (listening) setTimeout(startAudio, 2500);
    });

    async function pollStatus() {
      try {
        const res = await fetch(`${serverUrl}/api/status`, { cache: "no-store" });
        const data = await res.json();

        const isLive = data.state === "live";
        badge.classList.toggle("live", isLive);
        badgeText.textContent = isLive
          ? `LIVE (${data.delay_seconds}s buffer)`
          : data.state === "buffering" || data.state === "connecting"
          ? "LOADING..."
          : "STANDBY (SILENCE)";

        titleEl.textContent = data.title || "No Livestream Linked";
        statusMsg.textContent = data.message;
      } catch {
        badge.classList.remove("live");
        badgeText.textContent = "SERVER OFFLINE";
        statusMsg.textContent = "Cannot reach the audio relay server.";
      }
    }

    pollStatus();
    setInterval(pollStatus, 3000);
  </script>
</body>
</html>
